name: Flight Scraper

on:
    schedule:
        # Runs twice a day at 00:00 and 12:00 UTC (9:00 AM & 9:00 PM KST)
        - cron: "0 0,12 * * *"
    # Allows manually triggering the workflow from the GitHub Actions tab anytime
    workflow_dispatch:

jobs:
    scrape:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Install Playwright Browsers & Dependencies
              run: |
                  playwright install chromium --with-deps

            - name: Run Scraper
              env:
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
              run: |
                  python scraper.py

            - name: Upload Error Screenshots (if script fails)
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: error-screenshots
                  path: "*.png"
